services:
  postgres:
    image: postgres:16
    container_name: sem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_event_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sem_postgres_data:/var/lib/postgresql/data

volumes:
  sem_postgres_data:
